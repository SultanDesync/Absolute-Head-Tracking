; AbsoluteHeadTracking.ini - v1.0.0-beta.1
; Configure in-game through MOD OPTIONS -> Absolute Head Tracking in Absolute Control.
; OpenTrack uses "freetrack 2.0 Enhanced" output. Manual-look bindings can
; supplement it or operate rotational camera look without a tracker.
; This is the only configuration file. Back it up before updating if customized.

[General]
bEnabled = true
bEnableLog = false
iPollRateHz = 120

[Tracking]
bYawEnabled = true
bPitchEnabled = true
bRollEnabled = true
bInvertYaw = false
bInvertPitch = true
bInvertRoll = false
fYawSensitivity = 1.0
fPitchSensitivity = 1.0
fRollSensitivity = 1.0
; Minimum, center, and maximum are output camera angles at and around the
; physically recentered tracker pose. They may be asymmetric.
fYawMinimumDegrees = -85.0
fYawCenterDegrees = 0.0
fYawMaximumDegrees = 85.0
fPitchMinimumDegrees = -60.0
fPitchCenterDegrees = 0.0
fPitchMaximumDegrees = 60.0
fRollMinimumDegrees = -45.0
fRollCenterDegrees = 0.0
fRollMaximumDegrees = 45.0
fDeadzoneDegrees = 0.0
fSmoothing = 0.15
iStaleMilliseconds = 500

[AimRestriction]
; Half-angle from ship-forward. 30 degrees produces a 60-degree full cone.
bLimitAimToShipForwardCone = true
fFiringConeHalfAngleDegrees = 30.0

[Hotkeys]
; Capture these from the workbench's Bindings section or edit them manually.
; Set Ctrl/Alt/Shift false for a single-key binding such as iToggleKey=0x31.
; Defaults: Ctrl+Alt+H opens the workbench, Ctrl+Alt+C recenters, and
; Ctrl+Alt+T toggles tracking activation.
; Optional DirectInput bindings are captured from the Absolute Control Panel
; when AbsoluteHOTAS supplies the Absolute Input Bus. Keyboard bindings remain
; available as a fallback.
sRecenterControllerBinding =
sToggleControllerBinding =
iWorkbenchKey = 0x48
bWorkbenchCtrl = true
bWorkbenchAlt = true
bWorkbenchShift = false
iRecenterKey = 0x43
bRecenterCtrl = true
bRecenterAlt = true
bRecenterShift = false
iToggleKey = 0x54
bToggleCtrl = true
bToggleAlt = true
bToggleShift = false

; Optional retained manual-look trim. Keyboard and digital Input Bus directions
; add fDigitalRateDegreesPerSecond while held. Modifier-held raw mouse motion
; adds fMouseDegreesPerCount per count and retains the result until recenter.
iLookLeftKey = 0
bLookLeftCtrl = false
bLookLeftAlt = false
bLookLeftShift = false
iLookRightKey = 0
bLookRightCtrl = false
bLookRightAlt = false
bLookRightShift = false
iLookDownKey = 0
bLookDownCtrl = false
bLookDownAlt = false
bLookDownShift = false
iLookUpKey = 0
bLookUpCtrl = false
bLookUpAlt = false
bLookUpShift = false
iBankLeftKey = 0
bBankLeftCtrl = false
bBankLeftAlt = false
bBankLeftShift = false
iBankRightKey = 0
bBankRightCtrl = false
bBankRightAlt = false
bBankRightShift = false

[ManualLook]
fDigitalRateDegreesPerSecond = 60.0
; 0=disabled, 1=Alt, 2=Ctrl, 3=Shift
iMouseModifier = 0
fMouseDegreesPerCount = 0.08
bInvertMouseHorizontal = false
bInvertMouseVertical = false
; Captured analog axes are absolute offsets. Center is zero; negative and
; positive ends map independently to each calibrated asymmetric look range.
fControllerAxisDeadzone = 0.08
bInvertControllerYaw = false
bInvertControllerPitch = true
bInvertControllerRoll = false
sYawControllerAxisBinding =
sPitchControllerAxisBinding =
sRollControllerAxisBinding =
sLookLeftControllerBinding =
sLookRightControllerBinding =
sLookDownControllerBinding =
sLookUpControllerBinding =
sBankLeftControllerBinding =
sBankRightControllerBinding =

[UI]
bEnableWorkbench = true
