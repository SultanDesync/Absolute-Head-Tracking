; Absolute Head Tracking
; OpenTrack must be running with "freetrack 2.0 Enhanced" output enabled.
; This is the only configuration file. The in-game workbench writes it directly.

[General]
bEnabled = true
bEnableLog = false
iPollRateHz = 120

[Tracking]
bYawEnabled = true
bPitchEnabled = true
bRollEnabled = true
bInvertYaw = false
bInvertPitch = true
bInvertRoll = false
fYawSensitivity = 1.0
fPitchSensitivity = 1.0
fRollSensitivity = 1.0
fMaxYawDegrees = 85.0
fMaxPitchDegrees = 60.0
fMaxRollDegrees = 45.0
fDeadzoneDegrees = 0.0
fSmoothing = 0.15
iStaleMilliseconds = 500

[Hotkeys]
; Capture these from the workbench's Bindings section or edit them manually.
; Set Ctrl/Alt/Shift false for a single-key binding such as iToggleKey=0x31.
; Defaults: Ctrl+Alt+H opens the workbench, Ctrl+Alt+C recenters, and
; Ctrl+Alt+T toggles tracking activation.
iWorkbenchKey = 0x48
bWorkbenchCtrl = true
bWorkbenchAlt = true
bWorkbenchShift = false
iRecenterKey = 0x43
bRecenterCtrl = true
bRecenterAlt = true
bRecenterShift = false
iToggleKey = 0x54
bToggleCtrl = true
bToggleAlt = true
bToggleShift = false

[UI]
bEnableWorkbench = true
